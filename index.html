<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios del personal</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#18212f;--mut:#6b7686;--line:#dfe4ea;--line2:#edf0f4;--dv:#7d8ba0;--alt:rgba(24,33,47,.045);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#171e28;--ink:#e9eef5;--mut:#8f9bad;--line:#2a3442;--line2:#202a37;--dv:#5b6d86;--alt:rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#171e28;--ink:#e9eef5;--mut:#8f9bad;--line:#2a3442;--line2:#202a37;--dv:#5b6d86;--alt:rgba(255,255,255,.04)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{padding:10px 14px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.acts{display:flex;gap:6px}.body.alt{background-color:var(--alt)}.s{display:none}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.hint{color:var(--mut);font-size:12px;margin:2px 0 0}
#msg{color:#c0392b;font-size:12.5px;min-height:16px;margin-top:2px}
button.clr{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
#pal{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0}
.chip{flex:1 1 104px;max-width:180px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;color:#fff;font-weight:600;cursor:grab;touch-action:none;-webkit-touch-callout:none;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.chip small{font-weight:500;opacity:.85;font-size:11.5px}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:9px 14px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
#sc{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#grid{display:grid;grid-template-columns:52px repeat(7,minmax(var(--cw,312px),1fr));min-width:max-content;width:100%}
.dh{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line);border-left:2px solid var(--dv);padding:9px 8px;font-weight:700;text-align:center;grid-row:1}
.corner{position:sticky;top:0;left:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);grid-area:1/1}
.gut{position:sticky;left:0;z-index:5;background:var(--panel);height:calc(var(--n)*40px);grid-area:2/1}
.gut div{height:40px;font-size:11px;color:var(--mut);text-align:right;padding:2px 6px 0 0;box-sizing:border-box}
.body{grid-row:2;position:relative;height:calc(var(--n)*40px);border-left:2px solid var(--dv);
background-image:linear-gradient(to right,var(--line2) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
background-size:calc(100%/6) 100%,100% 40px}
#ov{grid-area:2/2/3/9;position:relative;z-index:2;pointer-events:none;height:calc(var(--n)*40px)}
.blk{position:absolute;box-sizing:border-box;padding:1px;touch-action:none;cursor:grab;pointer-events:auto;-webkit-touch-callout:none}
.blk .in{position:relative;height:100%;border-radius:7px;color:#fff;padding:9px 3px 3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:10.5px;line-height:1.2}
.blk b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.blk span{opacity:.92}
.blk.drag{z-index:10;opacity:.85}
.rz{position:absolute;left:0;right:0;height:13px;cursor:ns-resize;z-index:2;touch-action:none}
.rz.t{top:0}.rz.b{bottom:0}
.rz::after{content:"";position:absolute;left:28%;right:28%;height:3px;border-radius:2px;background:rgba(255,255,255,.8)}
.rz.t::after{top:3px}.rz.b::after{bottom:3px}
.x{position:absolute;top:12px;right:2px;width:16px;height:16px;border:0;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;font-size:11px;line-height:16px;padding:0;cursor:pointer;z-index:3}
.compact .f{display:none}.compact .s{display:inline}.compact .dh{padding:9px 1px;font-size:12px}
.compact .blk b,.compact .blk span,.compact .x{display:none}
.compact .blk .in{padding:9px 0 0;border-radius:4px}
.compact .blk .in::before{content:attr(data-i);display:block;text-align:center;font-weight:700;font-size:10px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Horarios del personal</h1><div class="acts"><button class="clr" id="zo" aria-label="Alejar">−</button><button class="clr" id="zi" aria-label="Acercar">+</button><button class="clr" id="zf">Ver semana</button><button class="clr" id="clr">Vaciar</button></div></div>
  <p class="hint">Arrastra un empleado a un día. Estira los bordes del bloque para cambiar sus horas. Para un turno partido, suelta al mismo empleado otra vez en ese día.</p>
  <div id="pal"></div>
  <div id="msg"></div>
</header>
<div id="sc"><div id="grid"></div></div>
<script>
const EMP=[{n:'Jefferson',c:'#e2622a'},{n:'Jean',c:'#2f7de1'},{n:'María',c:'#d6337f'},{n:'Alberto',c:'#12905f'},{n:'Alonso',c:'#7c4ddb'},{n:'Edgar',c:'#b7791f'}];
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const S=7,E=24,HH=40,L=6,SNAP=.5,DUR=4,N=E-S;
const API='/api/shifts';
let shifts=[];try{shifts=JSON.parse(localStorage.getItem('horarios-v1')||'[]')}catch(e){}
const save=()=>{
  try{localStorage.setItem('horarios-v1',JSON.stringify(shifts))}catch(e){}
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(shifts)})
    .then(r=>{if(!r.ok)throw 0})
    .catch(()=>toast('Guardado en este dispositivo; no se pudo sincronizar con la nube.'));
};
async function pull(){
  try{
    const r=await fetch(API);if(!r.ok)return;
    const remote=await r.json();
    if(Array.isArray(remote)&&remote.length){
      shifts=remote;try{localStorage.setItem('horarios-v1',JSON.stringify(shifts))}catch(e){}render();
    }else if(shifts.length){
      save();
    }
  }catch(e){}
}
const $=s=>document.querySelector(s),sc=$('#sc'),grid=$('#grid'),pal=$('#pal'),msg=$('#msg');
const snap=h=>Math.round(h/SNAP)*SNAP,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=h=>{const m=Math.round(h*60),H=Math.floor(m/60),M=m%60,x=H%24;return (x%12||12)+(M?':'+String(M).padStart(2,'0'):'')+(x<12?'am':'pm')};
const dur=h=>Number.isInteger(h)?''+h:h.toFixed(1);
const lab=h=>((h%24)%12||12)+(h%24<12?' AM':' PM');
let tm;function toast(t){msg.textContent=t;clearTimeout(tm);tm=setTimeout(()=>msg.textContent='',2800)}

grid.style.setProperty('--n',N);
grid.innerHTML='<div class="corner"></div>'+DAYS.map((d,i)=>`<div class="dh" style="grid-column:${i+2}"><span class="f">${d}</span><span class="s">${d.slice(0,3)}</span></div>`).join('')+
 '<div class="gut">'+Array.from({length:N},(_,i)=>`<div>${lab(S+i)}</div>`).join('')+'</div>'+
 DAYS.map((_,i)=>`<div class="body${i%2?' alt':''}" style="grid-column:${i+2}"></div>`).join('')+'<div id="ov"></div>';
const ov=$('#ov');
pal.innerHTML=EMP.map((e,i)=>`<div class="chip" data-i="${i}" style="background:${e.c}">${e.n}<small id="t${i}">0 h</small></div>`).join('');
document.addEventListener('contextmenu',e=>e.preventDefault());

function locate(x,y){
  const s=sc.getBoundingClientRect(),r=ov.getBoundingClientRect();
  if(y<s.top||y>s.bottom||x<r.left||x>=r.right||x<s.left)return null;
  const k=clamp(Math.floor((x-r.left)/r.width*7*L),0,7*L-1);
  return{day:Math.floor(k/L),lane:k%L,h:S+(y-r.top)/HH};
}
function fit(s,day,lane,a,b){
  if(shifts.some(o=>o.id!==s.id&&o.emp===s.emp&&o.day===day&&a<o.end&&b>o.start))return -2;
  const ord=[...Array(L).keys()].sort((x,y)=>Math.abs(x-lane)-Math.abs(y-lane));
  const l=ord.find(k=>!shifts.some(o=>o.id!==s.id&&o.day===day&&o.lane===k&&a<o.end&&b>o.start));
  return l===undefined?-1:l;
}
const free=(s,a,b)=>!shifts.some(o=>o.id!==s.id&&o.day===s.day&&a<o.end&&b>o.start&&(o.lane===s.lane||o.emp===s.emp));

const nodes=new Map();
function render(){
  const ids=new Set(shifts.map(s=>s.id));
  nodes.forEach((n,id)=>{if(!ids.has(id)){n.remove();nodes.delete(id)}});
  shifts.forEach(s=>{
    let n=nodes.get(s.id);
    if(!n){
      n=document.createElement('div');n.className='blk';n.sid=s.id;
      n.innerHTML=`<div class="in" data-i="${EMP[s.emp].n[0]}" style="background:${EMP[s.emp].c}"><div class="rz t" data-m="t"></div><b>${EMP[s.emp].n}</b><span></span><button class="x" aria-label="Quitar turno">×</button><div class="rz b" data-m="b"></div></div>`;
      ov.appendChild(n);nodes.set(s.id,n);
    }
    n.style.cssText=`left:${(s.day*L+s.lane)*100/(7*L)}%;width:${100/(7*L)}%;top:${(s.start-S)*HH}px;height:${(s.end-s.start)*HH}px`;
    n.querySelector('span').innerHTML=fmt(s.start)+'<br>'+fmt(s.end);
  });
  EMP.forEach((_,i)=>{const h=shifts.filter(s=>s.emp===i).reduce((a,s)=>a+s.end-s.start,0);$('#t'+i).textContent=dur(h)+' h'});
}

/* seguimiento del puntero (evita que el dedo desplace la página) */
const stop=e=>{if(e.cancelable)e.preventDefault()};
function track(mv,end){
  const up=e=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);removeEventListener('touchmove',stop);end(e)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  addEventListener('touchmove',stop,{passive:false});
}

/* empleados de arriba -> semana */
pal.addEventListener('pointerdown',ev=>{
  const chip=ev.target.closest('.chip');if(!chip)return;ev.preventDefault();
  const i=+chip.dataset.i,e=EMP[i],g=document.createElement('div');
  g.className='ghost';g.textContent=e.n;g.style.background=e.c;document.body.appendChild(g);
  try{chip.setPointerCapture(ev.pointerId)}catch(_){}
  const pos=m=>{g.style.left=m.clientX+'px';g.style.top=(m.clientY-34)+'px'};pos(ev);
  track(pos,m=>{
    g.remove();if(m.type==='pointercancel')return;
    const loc=locate(m.clientX,m.clientY);if(!loc)return;
    const a=snap(clamp(loc.h,S,E-DUR)),nx=Math.min(a+DUR,...shifts.filter(o=>o.emp===i&&o.day===loc.day&&o.start>=a).map(o=>o.start));
    if(nx-a<SNAP)return toast(`${e.n} ya tiene turno a esa hora. Elige otro hueco.`);
    const s={id:Date.now()+Math.random(),emp:i,day:loc.day,lane:0,start:a,end:nx};
    const l=fit(s,loc.day,loc.lane,s.start,s.end);
    if(l===-2)return toast(`${e.n} ya tiene turno a esa hora ese día.`);
    if(l<0)return toast('No hay espacio libre a esa hora en ese día.');
    s.lane=l;shifts.push(s);save();render();
  });
});

/* mover o estirar un turno */
ov.addEventListener('pointerdown',ev=>{
  const n=ev.target.closest('.blk');if(!n||ev.target.closest('.x'))return;
  const s=shifts.find(o=>o.id===n.sid);if(!s)return;
  ev.preventDefault();
  const mode=ev.target.dataset.m||'m',l0=locate(ev.clientX,ev.clientY),off=l0?l0.h-s.start:0;
  n.classList.add('drag');try{n.setPointerCapture(ev.pointerId)}catch(_){}
  track(m=>{
    if(mode==='m'){
      const loc=locate(m.clientX,m.clientY);if(!loc)return;
      const d=s.end-s.start,a=snap(clamp(loc.h-off,S,E-d)),l=fit(s,loc.day,loc.lane,a,a+d);
      if(l>=0){s.day=loc.day;s.lane=l;s.start=a;s.end=a+d}
    }else{
      const h=snap(S+(m.clientY-ov.getBoundingClientRect().top)/HH);let a=s.start,b=s.end;
      if(mode==='t')a=clamp(h,S,s.end-SNAP);else b=clamp(h,s.start+SNAP,E);
      if(free(s,a,b)){s.start=a;s.end=b}
    }
    render();
  },()=>{n.classList.remove('drag');save();render()});
});
ov.addEventListener('click',ev=>{
  const x=ev.target.closest('.x');if(!x)return;
  const id=x.closest('.blk').sid;shifts=shifts.filter(o=>o.id!==id);save();render();
});
$('#clr').onclick=()=>{if(shifts.length&&confirm('¿Vaciar todos los turnos de la semana?')){shifts=[];save();render()}};
const ZS=[312,240,170,110,0];let zi=0;
function zoom(i){
  zi=clamp(i,0,ZS.length-1);grid.style.setProperty('--cw',ZS[zi]+'px');grid.style.minWidth=ZS[zi]?'max-content':'0';
  requestAnimationFrame(()=>grid.classList.toggle('compact',ov.clientWidth/(7*L)<36));
}
$('#zo').onclick=()=>zoom(zi+1);$('#zi').onclick=()=>zoom(zi-1);$('#zf').onclick=()=>zoom(zi===ZS.length-1?0:ZS.length-1);
$('#zf').textContent='Ver semana';
addEventListener('resize',()=>zoom(zi));
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
render();zoom(0);pull();
</script>
</body>
</html>
